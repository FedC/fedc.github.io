	<meta property="og:site_name" content="OKCoded" />

	<meta name="twitter:card" content="summary" />

	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "ContactPage",
		"name": "Contact OKCoded",
		"url": "https://okcd.io/contact/",
		"mainEntity": {
			"@type": "Organization",
			"name": "OKCoded",
			"url": "https://okcd.io/",
			"email": "hello@okcd.io"
		}
	}
	</script>
</head>
<body class="site-page">
	<header class="frame">
		<div class="frame__title-wrap">
			<p class="frame__title"><a href="/" data-nav>Okcd.io</a></p>
		</div>
		<nav class="frame__links site-nav" aria-label="Primary">
			<a href="/services/" data-nav>Services</a>
			<a href="/work/" data-nav>Work</a>
			<a href="/insights/" data-nav>Insights</a>
			<a href="/about/" data-nav>About</a>
			<a href="/contact/" data-nav>Contact</a>
		</nav>
	</header>

	<main class="site-main">
		<section class="contact-section" id="contact" aria-labelledby="contact-heading">
			<header class="page-hero js-reveal">
				<span class="page-hero__label">Contact</span>
				<h1 class="page-hero__title" id="contact-heading">Discuss your project</h1>
				<p class="page-hero__lede">Websites, mobile applications, custom software, integrations, or automation — short briefs beat long intros. Email or use the form.</p>
			</header>
			<div class="contact-panel js-reveal">
				<p class="contact-panel__alt">
					Prefer email?
					<a href="mailto:hello@okcd.io">hello@okcd.io</a>
				</p>
				<form action="https://formspree.io/f/xpwzwrev" method="POST" id="contact-form">
					<div class="contact-honeypot" aria-hidden="true">
						<label for="contact-gotcha">Company website</label>
						<input type="text" name="_gotcha" id="contact-gotcha" tabindex="-1" autocomplete="off" />
					</div>
					<input type="hidden" name="_subject" value="OKCoded contact form" />
					<div class="contact-field">
						<label class="contact-field__label" for="email-input">
							Email <span class="contact-field__req" aria-hidden="true">*</span>
							<span class="visually-hidden"> (required)</span>
						</label>
						<input class="contact-field__control" type="email" name="email" id="email-input" required autocomplete="email" inputmode="email" spellcheck="false" aria-required="true" aria-describedby="form-response" />
					</div>
					<div class="contact-field">
						<label class="contact-field__label" for="message-input">
							Message <span class="contact-field__req" aria-hidden="true">*</span>
							<span class="visually-hidden"> (required)</span>
						</label>
						<textarea class="contact-field__control contact-field__control--area" id="message-input" name="message" required rows="6" autocomplete="off" aria-required="true" aria-describedby="form-response"></textarea>
					</div>
					<button type="submit" class="contact-submit" id="contact-submit">
						<span class="contact-submit__label">Send message</span>
					</button>
					<p id="form-response" class="contact-status" role="status" aria-live="polite" hidden></p>
				</form>
			</div>
		</section>
	</main>

	<footer class="site-footer">
		<p class="site-footer__meta">
			<a class="site-footer__link" href="https://fedc.github.io/"><span id="footer-year">2026</span> &copy; Federico Commisso</a>
			<span class="site-footer__sep" aria-hidden="true">·</span>
			<a class="site-footer__gem" href="/#playground">Playground</a>
		</p>
	</footer>

	<script type="module" src="../app/sitePage.js"></script>

		gtag('js', new Date());

</body>
</html>
